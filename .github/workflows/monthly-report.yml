name: 月次レポート自動生成（やんばる国内観光客）

# 【自動スケジュールは停止中】手書きで作り込んだ月を上書きしないよう、cronによる自動発火は無効化。
# 必要なときだけ手動実行（workflow_dispatch）で対象月を指定して生成する。
# 自動運用を再開したい場合は、下の schedule ブロックのコメントを外す（既存月の上書きに注意）。

on:
  # schedule:
  #   - cron: "0 0 1-3 * *"   # 毎月1〜3日 09:00 JST（停止中）
  workflow_dispatch:
    inputs:
      month:
        description: "対象月 YYYY-MM（空欄なら前月）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: monthly-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係インストール
        run: pip install pandas numpy

      - name: レポート生成（前月分／GitHub全件データを取得して集計）
        run: |
          if [ -n "${{ github.event.inputs.month }}" ]; then
            python scripts/generate_report.py --month "${{ github.event.inputs.month }}"
          else
            python scripts/generate_report.py
          fi

      - name: 変更をコミット＆プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Auto: 月次レポート自動生成（前月分・国内）[skip ci]"
            git push
            echo "コミット・プッシュしました。"
          else
            echo "変更なし（データ未更新または既に最新）。コミットをスキップします。"
          fi
